# CI 门禁:构建 + 静态检查 + 全量测试(需要 PostgreSQL,测试基建见 db/testmain_test.go)
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pojun
          POSTGRES_PASSWORD: pojuntest
          POSTGRES_DB: pojun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pojun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POJUN_PG_DSN: postgres://pojun:pojuntest@localhost:5432/pojun_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Go module proxy 偶发 stream INTERNAL_ERROR（2026-11-18 v0.4.84 构建失败即此因）。
      # setup-go 的 cache 只在命中时省下载；首次/换 go.sum 仍需拉模块，这里显式重试。
      - name: Download Go modules (retry transient proxy errors)
        run: |
          for i in 1 2 3 4; do
            if go mod download; then exit 0; fi
            echo "go mod download failed (attempt $i), retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Test installer listen normalization
        # bash -n 只查语法；这里跑地址归一的输入矩阵（默认/纯端口/0.0.0.0/
        # IPv6/非法 IPv4/主机名/zone/端口越界）与 compose 映射判定。
        run: bash scripts/install_listen_test.sh
      - name: Test
        # -p 1: 连 PG 的测试包不止持有跨包 advisory lock 的 db/agent/server 三个
        # (llmrec/evidence/traffic 等无锁),CI 多核并行时与 agent 包写事务死锁
        # (SQLSTATE 40P01,两轮稳定复现)。串行跑包与 TestMain 的锁设计意图一致。
        run: go test -p 1 ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      # 纯模块单测（链路布局/活动合并等，node:test + type stripping）：不依赖
      # 浏览器或 DOM，跑在 build 之前，几何/可读性回归先于导出失败暴露。
      - name: Unit tests
        run: npm test
        working-directory: web
      # lint 暂不进门禁：存量 75 个 error 均为行为级修复（空 catch 补处理、悬浮
      # Promise 补 await、a11y），与最小 diff 原则冲突，留作独立治理任务；
      # build:static 已覆盖 TS 类型检查与静态导出验证。
      - name: Build (static export)
        run: npm run build:static
        working-directory: web
      # 预鉴权可达的静态资产回归：品牌图必须已移出 public/（改用模块导入 +
      # 哈希文件名），只允许中性 icon.svg / favicon.ico 在导出根目录。
      - name: Assert exported assets are brand-neutral
        working-directory: web
        run: |
          set -euo pipefail
          test ! -e out/logo.png
          test ! -e out/logo.svg
          test ! -e out/logo-mono.svg
          test ! -e out/icon.png
          test -f out/icon.svg
          test -f out/favicon.ico
          # 未鉴权 HTML 不得出现产品名（JS chunk 里的登录契约字面量是已知残余）
          ! grep -rIl -e POJUN -e 破军 out --include='*.html' --exclude-dir=_next
          ! grep -rIl '/logo.png' out
          test "$(stat -c%s out/icon.svg)" -lt 4096
          test "$(stat -c%s out/favicon.ico)" -lt 20000
          # logo.png 的哈希副本仍在 _next/static/media（静态导出无法隐藏，已如实登记）
          ls out/_next/static/media | grep -qi 'logo'
          file out/favicon.ico | grep -qi 'MS Windows icon'

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `config --format json` 依赖 compose 版本；runner 漂移时先打印版本，
      # 免得降级成难读的 jq 报错。
      - name: Print compose version
        run: docker compose version
      # 宿主侧默认必须回环；容器内 0.0.0.0 由镜像 CMD 固定，不在这里断言。
      # install.sh 生成的 compose 模板由 scripts/install_listen_test.sh 覆盖
      # （PORTMAP 的引号/格式与宿主地址判定）。
      - name: Assert compose binds console to loopback
        env:
          POSTGRES_PASSWORD: x
        run: |
          set -euo pipefail
          cfg="$(docker compose -f docker-compose.yml config --format json)"
          echo "$cfg" | jq -e '.services.pojun.ports[] | select(.target == 8787)
            | (.host_ip | if type == "array" then . == ["127.0.0.1"] else . == "127.0.0.1" end)'
          echo "$cfg" | jq -e '.services.pojun.ports[] | select(.target == 8788)
            | (.host_ip | if type == "array" then . == ["127.0.0.1"] else . == "127.0.0.1" end)'
          cfg_open="$(POJUN_BIND_IP=0.0.0.0 docker compose -f docker-compose.yml config --format json)"
          echo "$cfg_open" | jq -e '.services.pojun.ports[] | select(.target == 8787)
            | (.host_ip | if type == "array" then . == ["0.0.0.0"] else . == "0.0.0.0" end)'
          echo "$cfg_open" | jq -e '.services.pojun.ports[] | select(.target == 8788)
            | (.host_ip | if type == "array" then . == ["127.0.0.1"] else . == "127.0.0.1" end)'
      # ports 是列表追加合并：override 若重复声明 8787/8788 会叠加映射，
      # 历史上最容易踩的就是重复绑定。合并后仍必须是回环。
      - name: Assert merged overrides keep loopback
        env:
          POSTGRES_PASSWORD: x
        run: |
          set -euo pipefail
          for ov in docker-compose.windows.yml docker-compose.macos.yml; do
            echo "== $ov =="
            cfg="$(docker compose -f docker-compose.yml -f "$ov" config --format json)"
            echo "$cfg" | jq -e '.services.pojun.ports[] | select(.target == 8787)
              | (.host_ip | if type == "array" then (. == ["127.0.0.1"]) else . == "127.0.0.1" end)'
            echo "$cfg" | jq -e '.services.pojun.ports[] | select(.target == 8788)
              | (.host_ip | if type == "array" then (. == ["127.0.0.1"]) else . == "127.0.0.1" end)'
          done
